services:
  products.api:
    image: ${DOCKER_REGISTRY-}productsapi
    container_name: products_api  # <-- Добавили
    build:
      context: .
      dockerfile: SRC/Products.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080 # Явно указываем порт внутри контейнера
      # Используем переменные из .env
      # ВАЖНО: двойное подчеркивание __ заменяется на :
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME}
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - Keycloak__InternalUrl=${KEYCLOAK_INTERNAL_URL}
    ports:
      - "5000:8080" # 🔥 ФИКСИРУЕМ ПОРТ: 5000 на твоей машине -> 8080 внутри контейнера
    depends_on:
      products_postgres:
        condition: service_healthy # 🔥 ЖДЁМ ПОЛНОЙ ГОТОВНОСТИ БД

  products_postgres:
    image: pgvector/pgvector:pg17
    container_name: products_postgres  # <-- Добавили
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/SQL:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:  # <-- Добавляем redis для кеша!!!
    image: redis:7-alpine
    container_name: products_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  seq:  # <-- Добавляем Seq для красивого структурированного логирования
    image: datalust/seq:latest
    container_name: products_seq
    ports:
      - "5341:5341"   # Порт для приема логов из приложения (Ingestion API)
      - "8081:80"     # Порт для красивого UI в браузере
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD} # 🔥 Читаем пароль из .env!
    volumes:
      - seq_data:/data  # Том остаётся здесь, так как это часть инфраструктуры
    restart: unless-stopped

  # База данных для Keycloak (отдельная от нашей products_postgres)
  keycloak_db:
    image: postgres:17-alpine
    container_name: products_keycloak_db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5433:5432"  # 🔥 Добавили! 5433 на твоей машине -> 5432 в контейнере
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Keycloak - сервер аутентификации
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: products_keycloak
    command: start-dev  # Режим разработки (в продакшене будет "start")
    environment:
      # Настройки подключения к БД
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      
      # Администратор Keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      
      # Настройки сервера
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
    ports:
      - "8082:8080"  # UI Keycloak
    depends_on:
      keycloak_db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:    # Объявление тома для postgres
  seq_data:         # Объявление тома для Seq
  keycloak_db_data: # Объявление тома для БД Keycloak