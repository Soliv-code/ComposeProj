services:
  products.api:
    image: ${DOCKER_REGISTRY-}productsapi
    container_name: products_api  # <-- Добавили
    build:
      context: .
      dockerfile: SRC/Products.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080 # Явно указываем порт внутри контейнера
      # Используем переменные из .env
      #- ConnectionStrings__DefaultConnection=Host=products_postgres;Port=5432;Database=products_db;Username=postgres;Password=postgres
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    ports:
      - "5000:8080" # 🔥 ФИКСИРУЕМ ПОРТ: 5000 на твоей машине -> 8080 внутри контейнера
    depends_on:
      products_postgres:
        condition: service_healthy # 🔥 ЖДЁМ ПОЛНОЙ ГОТОВНОСТИ БД

  products_postgres:
    image: pgvector/pgvector:pg17
    container_name: products_postgres  # <-- Добавили
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/SQL:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:  # <-- Добавляем redis для кеша!!!
    image: redis:7-alpine
    container_name: products_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: