services:
  products.api:
    image: ${DOCKER_REGISTRY-}productsapi
    container_name: products_api  # <-- Добавили
    build:
      context: .
      dockerfile: SRC/Products.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080 # Явно указываем порт внутри контейнера
      # Используем переменные из .env
      # ВАЖНО: двойное подчеркивание __ заменяется на :
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - Redis__InstanceName=${REDIS_INSTANCE_NAME}
    ports:
      - "5000:8080" # 🔥 ФИКСИРУЕМ ПОРТ: 5000 на твоей машине -> 8080 внутри контейнера
    depends_on:
      products_postgres:
        condition: service_healthy # 🔥 ЖДЁМ ПОЛНОЙ ГОТОВНОСТИ БД

  products_postgres:
    image: pgvector/pgvector:pg17
    container_name: products_postgres  # <-- Добавили
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/SQL:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:  # <-- Добавляем redis для кеша!!!
    image: redis:7-alpine
    container_name: products_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  seq:  # <-- Добавляем Seq для красивого структурированного логирования
    image: datalust/seq:latest
    container_name: products_seq
    ports:
      - "5341:5341"   # Порт для приема логов из приложения (Ingestion API)
      - "8081:80"     # Порт для красивого UI в браузере
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD} # 🔥 Читаем пароль из .env!
    volumes:
      - seq_data:/data  # Том остаётся здесь, так как это часть инфраструктуры
    restart: unless-stopped

volumes:
  postgres_data:  # Объявление тома для postgres
  seq_data:       # Объявление тома для Seq