services:
  products.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5000:8080" # Жёстко фиксируем: браузер 5000 -> контейнер 8080

  products_postgres:
    ports:
      - "5432:5432" # Жёстко фиксируем: DBeaver 5432 -> контейнер 5432